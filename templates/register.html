<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SmartStudyPlanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('smart_study_theme') || 'theme-light';
            document.documentElement.className = savedTheme;
        })();
    </script>
</head>
<body class="theme-light">
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="brand-wrapper" style="text-decoration: none;">
                <span class="smart-logo-dot"></span>
                <span class="brand-title" style="letter-spacing: -0.5px;">SmartStudyPlanner</span>
            </a>

            <div class="nav-actions" style="display: flex; align-items: center; gap: 10px;">
                <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
                    🌓 Theme
                </button>
                <a href="/login" class="btn-pill-outline" style="padding: 7px 16px; font-size: 0.84rem;">Log In</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Get Started 🚀</h2>
            <p class="subtitle">Join SmartStudyPlanner to organize your study sessions with smart AI.</p>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/register">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                
                <div class="auth-form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="auth-form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="student@example.com" required>
                </div>

                <div class="auth-form-group">
                    <label for="password">Password (min 6 chars)</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="auth-form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Verify password" required>
                </div>

                <button type="submit" class="btn-auth-submit">Create Free Account</button>
            </form>

            <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="/login" style="color: var(--primary); font-weight: 700; text-decoration: none;">Log in here</a>
            </p>
        </div>
    </div>

    <script>
        function applyTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('smart_study_theme', theme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerHTML = theme === 'theme-dark' ? '☀️ Light' : '🌙 Dark';
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('theme-dark');
            applyTheme(isDark ? 'theme-light' : 'theme-dark');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('smart_study_theme') || 'theme-light';
            applyTheme(saved);
        });
    </script>
</body>
</html>
