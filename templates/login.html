<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — SmartStudyPlanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('smart_study_theme') || 'theme-light';
            document.documentElement.className = savedTheme;
        })();
    </script>
</head>
<body class="theme-light">
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="brand-wrapper" style="text-decoration: none;">
                <span class="smart-logo-dot"></span>
                <span class="brand-title" style="letter-spacing: -0.5px;">SmartStudyPlanner</span>
            </a>

            <div class="nav-actions" style="display: flex; align-items: center; gap: 10px;">
                <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
                    🌓 Theme
                </button>
                <a href="/register" class="btn-pill-outline" style="padding: 7px 16px; font-size: 0.84rem;">Create Account</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Welcome back 👋</h2>
            <p class="subtitle">Log in to continue your smart study flow.</p>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="success-message">
                {{ success }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                
                <div class="auth-form-group">
                    <label for="username_or_email">Username or Email</label>
                    <input type="text" id="username_or_email" name="username_or_email" placeholder="e.g. demo" value="demo" required>
                </div>

                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" value="password123" required>
                </div>

                <button type="submit" class="btn-auth-submit">Log In to Planner</button>
            </form>

            <div class="demo-autofill-box">
                <div class="demo-autofill-text">
                    <strong>Demo Student Account:</strong><br>
                    <span>User: <code>demo</code> | Pass: <code>password123</code></span>
                </div>
                <button type="button" class="demo-autofill-btn" onclick="fillDemo()">Fill Demo</button>
            </div>

            <p style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
                New here? <a href="/register" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create an account</a>
            </p>
        </div>
    </div>

    <script>
        function fillDemo() {
            document.getElementById('username_or_email').value = 'demo';
            document.getElementById('password').value = 'password123';
        }

        function applyTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('smart_study_theme', theme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.innerHTML = theme === 'theme-dark' ? '☀️ Light' : '🌙 Dark';
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('theme-dark');
            applyTheme(isDark ? 'theme-light' : 'theme-dark');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('smart_study_theme') || 'theme-light';
            applyTheme(saved);
        });
    </script>
</body>
</html>
