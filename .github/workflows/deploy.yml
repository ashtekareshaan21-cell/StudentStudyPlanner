name: Production CD Deploy

on:
  push:
    branches: [ main, master ]
  workflow_run:
    workflows: ["Python Flask Backend CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Trigger Render Automatic Deploy Webhook
      run: |
        echo "[CD DEPLOY] Triggering deployment on Render..."
        
        # Validate that the deploy hook URL exists
        if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing in GitHub repository settings."
          echo "Please configure it under Settings > Secrets and variables > Actions > New repository secret."
          exit 1
        fi
        
        # Perform curl POST request to trigger Render deploy
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
        
        if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 202 ]; then
          echo "[SUCCESS] Render deployment hook triggered successfully (HTTP status: $HTTP_STATUS)."
        else
          echo "::error::Render deployment hook failed with HTTP status code $HTTP_STATUS."
          exit 1
        fi
