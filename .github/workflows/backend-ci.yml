name: Python Flask Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Security scan with Bandit
      run: |
        # Scan python files for security risks (exclude virtual environments and test files)
        bandit -r . -x ./.venv,./venv,./test_planner.py,./test_db_models.py,./test_api.py,./test_tasks.py -ll

    - name: Run unit tests
      run: |
        python -m unittest discover -s . -p "test_*.py"

    - name: Verify Flask Application Imports
      run: |
        # Validates that Flask starts up and packages import correctly without crashing
        python -c "import app"
