databases:
  - name: smartstudy-db
    databaseName: smartstudy
    user: smartstudy_user
    plan: free

services:
  - type: web
    name: smartstudy-planner
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    preDeployCommand: flask db upgrade
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartstudy-db
          property: connectionString
      - key: FLASK_APP
        value: app.py
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: true
