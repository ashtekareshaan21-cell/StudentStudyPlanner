version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_study_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smart_study}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-study_user} -d $${POSTGRES_DB:-smart_study}"]
      timeout: 10s
      retries: 5
      interval: 10s

  web:
    build: .
    container_name: smart_study_web
    restart: always
    environment:
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-study_user}:${POSTGRES_PASSWORD:-study_secure_pass}@db:5432/${POSTGRES_DB:-smart_study}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-defaultsecretkeychangeme}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
